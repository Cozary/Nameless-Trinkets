name: Feature Request
description: Suggest a new feature
labels: ["type: feature request"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Describe your idea
      description: What feature would you like to see added?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why is this feature important?
      description: Explain why this feature would improve the mod.
    validations:
      required: false
